<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Sharm Excursions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--sea:#051e34;--aqua:#0891b2;--gold:#b8860b;--gold-bright:#e6b822;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
    h1,h2{font-family:'Playfair Display',serif;}
    .wave{font-size:80px;animation:wave 2s ease-in-out infinite;}
    @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .btn{display:inline-block;padding:14px 32px;border-radius:50px;font-weight:700;font-size:15px;text-decoration:none;transition:all 0.2s;}
    .btn-primary{background:linear-gradient(135deg,var(--sea),var(--aqua));color:white;box-shadow:0 6px 20px rgba(10,61,98,0.3);}
    .btn-primary:hover{transform:translateY(-2px);}
    .btn-secondary{background:white;color:var(--sea);border:2px solid #e2e8f0;}
  </style>
</head>
<body>
  <div class="wave">🌊</div>
  <h1 style="font-size:80px;color:#e2e8f0;font-weight:900;margin:8px 0">404</h1>

  </div>
  <div style="margin-top:40px;color:#94a3b8;font-size:13px;">
    Need help? <a href="https://wa.me/201223373289" style="color:var(--aqua);font-weight:600">Chat with us on WhatsApp 💬</a>
  </div>
</body>
</html>
