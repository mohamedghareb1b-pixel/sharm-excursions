<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wishlist — Sharm Excursions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--sea:#051e34;--aqua:#0891b2;--teal:#0e7490;--gold:#b8860b;--gold-bright:#e6b822;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:#f8fafc;color:#0f172a;}
    h1,h2,h3{font-family:'Playfair Display',serif;}
    .top-nav{position:sticky;top:0;z-index:50;background:rgba(5,30,52,0.96);backdrop-filter:blur(16px);border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;align-items:center;gap:12px;}
    .back-link{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;display:flex;align-items:center;justify-content:center;text-decoration:none;color:white;font-size:16px;}
    .wish-card{background:white;border-radius:20px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:14px;display:flex;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
    .wish-img{width:110px;height:110px;object-fit:cover;flex-shrink:0;}
    .wish-body{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
    .wish-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:white;line-height:1.35;margin-bottom:4px;}
    .wish-price{font-size:16px;font-weight:800;color:white;}
    .wish-actions{display:flex;gap:6px;margin-top:8px;}
    .btn-book{flex:1;padding:8px 0;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:white;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;}
    .btn-remove{width:36px;padding:8px;border-radius:10px;border:1.5px solid #fee2e2;background:#fff5f5;cursor:pointer;font-size:14px;color:#dc2626;}
    .empty-state{text-align:center;padding:60px 20px;}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#94a3b8;font-size:10px;font-weight:500;}
    .nav-item:hover{color:var(--aqua);}
    .nav-icon{font-size:20px;}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--sea);color:white;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#f0f9ff;color:var(--teal);border:1px solid #bae6fd;}
  </style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="top-nav">
  <a href="index.html" class="back-link">←</a>
  <div style="flex:1"><div class="font-bold text-sm" style="color:white">My Wishlist ❤️</div><div class="text-xs text-slate-400" id="countLabel">0 saved tours</div></div>
  <button onclick="clearAll()" class="text-xs text-red-400 font-semibold" id="clearBtn" style="display:none">Clear All</button>
</div>

<main class="px-4 pb-28 pt-5 max-w-lg mx-auto">
  <div id="emptyState" class="empty-state" style="display:none">
    <div style="font-size:60px;margin-bottom:16px">💔</div>
    <h2 class="text-xl font-bold mb-2" style="color:white">Your wishlist is empty</h2>
    <p class="text-slate-500 text-sm mb-6">Tap the ❤️ icon on any tour to save it here for later.</p>
    <a href="index.html" class="inline-block px-6 py-3 rounded-2xl font-bold text-sm text-white" style="background:var(--sea)">Browse Tours →</a>
  </div>

  <div id="wishList"></div>

  <div id="bookAllWrap" style="display:none">
    <div class="rounded-2xl p-4 mb-4" style="background:var(--sand,#fef3c7);border:1px solid #fde68a">
      <div class="text-sm font-bold mb-1" style="color:white">Ready to book everything?</div>
      <div class="text-xs text-slate-500 mb-3">All saved tours will appear in your booking cart.</div>
      <a href="booking.html" class="block text-center py-3 rounded-xl font-bold text-sm text-white" style="background:linear-gradient(135deg,var(--gold),var(--gold-light))">📋 Proceed to Booking →</a>
    </div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
  <a href="index.html#tours" class="nav-item"><span class="nav-icon">🏍️</span><span>Safari</span></a>
  <a href="booking.html" class="nav-item"><span class="nav-icon">🛒</span><span>Book</span></a>
  <a href="wishlist.html" class="nav-item"><span class="nav-icon">❤️</span><span>Saved</span></a>
  <a href="about.html" class="nav-item"><span class="nav-icon">ℹ️</span><span>About</span></a>
</nav>

<script>
const TOURS_DB={
  "quad-bike-safari":{title:"Sharm El Sheikh: Quad Bike Safari Adventure",price:35,childPrice:17.5,duration:"3 Hours",rating:4.9,image:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=300&q=80",badges:["Hotel Pickup","Pay on Arrival"]},
  "jeep-safari-stars":{title:"Sharm El Sheikh: Jeep Safari & Stargazing",price:45,childPrice:22.5,duration:"6 Hours",rating:4.8,image:"https://images.unsplash.com/photo-1469041797191-50ace28483c3?w=300&q=80",badges:["Hotel Pickup","Dinner Included"]},
  "snorkeling-ras-mohammed":{title:"Sharm El Sheikh: Ras Mohammed Snorkeling",price:40,childPrice:20,duration:"7 Hours",rating:5.0,image:"https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=300&q=80",badges:["Hotel Pickup","Lunch on Board"]},
  "sunset-boat-party":{title:"Sharm El Sheikh: Sunset Boat Party",price:30,childPrice:15,duration:"4 Hours",rating:4.7,image:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300&q=80",badges:["Hotel Pickup","DJ on Board"]},
  "beach-club-vip":{title:"Sharm El Sheikh: Beach Club VIP Day",price:55,childPrice:27.5,duration:"Full Day",rating:4.9,image:"https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=300&q=80",badges:["Hotel Pickup","Lunch Included"]},
  "parasailing":{title:"Sharm El Sheikh: Parasailing over the Red Sea",price:40,childPrice:20,duration:"1.5 Hours",rating:4.8,image:"https://images.unsplash.com/photo-1502680390469-be75c86b636f?w=300&q=80",badges:["Hotel Pickup","Safety Certified"]},
};
let cart=JSON.parse(localStorage.getItem('sharmCart')||'[]');
function saveCart(){localStorage.setItem('sharmCart',JSON.stringify(cart));}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function removeItem(id){cart=cart.filter(c=>c.id!==id);saveCart();renderWishlist();showToast('Removed from wishlist');}
function clearAll(){if(confirm('Clear all saved tours?')){cart=[];saveCart();renderWishlist();}}
function renderWishlist(){
  const list=document.getElementById('wishList');
  const empty=document.getElementById('emptyState');
  const bookAll=document.getElementById('bookAllWrap');
  const clearBtn=document.getElementById('clearBtn');
  const countLabel=document.getElementById('countLabel');
  countLabel.textContent=cart.length+' saved tour'+(cart.length!==1?'s':'');
  if(cart.length===0){empty.style.display='block';list.innerHTML='';bookAll.style.display='none';clearBtn.style.display='none';return;}
  empty.style.display='none';bookAll.style.display='block';clearBtn.style.display='block';
  list.innerHTML=cart.map(item=>{
    const t=TOURS_DB[item.id];if(!t)return'';
    return`<div class="wish-card">
      <img src="${t.image}" alt="${t.title}" class="wish-img"/>
      <div class="wish-body">
        <div>
          <div class="wish-title">${t.title}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0">${t.badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>
          <div style="font-size:11px;color:#64748b">⏱ ${t.duration} &nbsp; ★ ${t.rating}</div>
        </div>
        <div class="flex items-center justify-between mt-1">
          <div class="wish-price">$${t.price}<span style="font-size:10px;color:#94a3b8;font-weight:400"> /person</span></div>
        </div>
        <div class="wish-actions">
          <a href="tour.html?id=${item.id}" class="btn-book" style="text-align:center;text-decoration:none;display:block;line-height:2">View Tour</a>
          <a href="booking.html" class="btn-book" style="text-align:center;text-decoration:none;display:block;line-height:2;background:linear-gradient(135deg,var(--sea),var(--aqua))">Book Now</a>
          <button class="btn-remove" onclick="removeItem('${item.id}')">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
renderWishlist();
</script>
</body>
</html>
